---
- name: Hello World and install the vim package
  hosts: all

  tasks:
    - name: Hello World!
      shell: echo "Hi! Tower is working."
    
    - name: Install vim package
      yum:
        name: vim
        state: present
      become: true

    - name: Create a file with custom content
      copy:
        dest: /tmp/hello.txt
        content: "This is a test file."
    
    - name: Check if the file exists
      stat:
        path: /tmp/hello.txt
      register: file_stat

    - name: Display file status
      debug:
        msg: "The file exists: {{ file_stat.stat.exists }}"
